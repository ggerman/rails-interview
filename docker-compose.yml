# docker-compose.yml
services:
  # Redis (optional, for caching)
  redis:
    image: redis:7-alpine
    container_name: 05262026_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # Rails Web Server
  web:
    build: .
    container_name: 05262026_web
    command: bundle exec rails server -b 0.0.0.0
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - bundle_cache:/usr/local/bundle
    stdin_open: true
    tty: true

volumes:
  redis_data:
  bundle_cache:

networks:
  default:
    name: 05262026_network
